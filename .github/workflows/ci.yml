name: CI

on:
  push:
    branches: [main]
    paths: ["surge/**"]
  pull_request:
    branches: [main]
    paths: ["surge/**"]

# A newer push to the same ref supersedes this run: checks are
# side-effect free, so cancelling the stale one costs nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # surge-merge 的 bun 项目在 surge/ 子目录;mihomo/ 是纯配置,没有构建产物。
    defaults:
      run:
        working-directory: surge
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure Celados npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '%s\n' '@celados:registry=https://npm.celados.com' > .npmrc
          printf '%s\n' "//npm.celados.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
