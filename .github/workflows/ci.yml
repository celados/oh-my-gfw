name: CI

on:
  push:
    branches: [main]
    paths: ['surge/**']
  pull_request:
    branches: [main]
    paths: ['surge/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # surge-merge 的 bun 项目在 surge/ 子目录;mihomo/ 是纯配置,没有构建产物。
    defaults:
      run:
        working-directory: surge
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
